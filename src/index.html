
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestionnaire de tâches</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Gestionnaire de tâches</h1>
        <p>Organisation des projets et des tâches</p>
    </header>

    <main>

        <!-- TABLEAU DE BORD -->
        <section id="dashboard-section">

            <h2>Vue d'ensemble</h2>

            <div class="dashboard-grid">

                <article class="dashboard-card">
                    <span class="dashboard-label">Projets</span>
                    <strong id="dashboard-projects">0</strong>
                    <small>Nombre total de projets</small>
                </article>

                <article class="dashboard-card">
                    <span class="dashboard-label">Tâches</span>
                    <strong id="dashboard-tasks">0</strong>
                    <small>Nombre total de tâches</small>
                </article>

                <article class="dashboard-card">
                    <span class="dashboard-label">Terminées</span>
                    <strong id="dashboard-completed">0</strong>
                    <small>Tâches achevées</small>
                </article>

                <article class="dashboard-card">
                    <span class="dashboard-label">En attente</span>
                    <strong id="dashboard-pending">0</strong>
                    <small>Tâches restantes</small>
                </article>

            </div>

        </section>

        <!-- GESTION DES PROJETS -->
        <section id="projects-section">

            <h2>Mes projets</h2>

            <form id="project-form">

                <label for="project-name">
                    Nom du projet
                </label>

                <input
                    type="text"
                    id="project-name"
                    placeholder="Ex : Projet INF563"
                    required
                >

                <button type="submit">
                    Ajouter le projet
                </button>

            </form>

            <ul id="project-list"></ul>

        </section>

        <!-- GESTION DES TÂCHES -->
        <section id="tasks-section">

            <h2>Tâches</h2>

            <p id="no-project-message">
                Sélectionnez un projet pour afficher ses tâches.
            </p>

            <div id="task-content" style="display: none;">

                <h3 id="selected-project-name"></h3>

                <form id="task-form">

                    <label for="task-title">
                        Titre de la tâche
                    </label>

                    <input
                        type="text"
                        id="task-title"
                        placeholder="Ex : Réaliser les tests"
                        required
                    >

                    <label for="task-description">
                        Description
                    </label>

                    <textarea
                        id="task-description"
                        placeholder="Décrivez la tâche..."
                    ></textarea>

                    <button type="submit">
                        Ajouter la tâche
                    </button>

                </form>

                <ul id="task-list"></ul>

            </div>

        </section>

    </main>

    <script src="js/database.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
